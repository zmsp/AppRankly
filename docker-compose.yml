services:
  apprankly-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: AppRankly
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - CONFIG_PATH=/app/data/config/config.json
      - DATA_DIR=/app/data/
      - JWT_SECRET=change_this_to_a_secure_random_string
    volumes:
      # Mount host credentials & config directory (contains config.json and key files in ./config/keys/)
      - ./config:/app/data/config:ro
      # Persistent app data storage (auth credentials, releases, statistics cache)
      - apprankly_data:/app/data/
    restart: unless-stopped

volumes:
  apprankly_data:

